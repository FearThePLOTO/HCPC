<svg width="120" height="40" viewBox="0 0 120 40" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
<!-- pixel icons set for 8-bit theme: computer, medal, calendar -->
<!-- computer -->
<rect x="4" y="8" width="32" height="20" fill="#1A1A1E" stroke="#000" stroke-width="2"/>
<rect x="8" y="12" width="24" height="10" fill="#C7000B"/>
<rect x="10" y="14" width="6" height="6" fill="white" opacity="0.4"/>
<rect x="14" y="28" width="12" height="4" fill="#1A1A1E" stroke="#000" stroke-width="1"/>
<!-- medal -->
<rect x="44" y="6" width="32" height="28" fill="#FFD23F" stroke="#000" stroke-width="2"/>
<rect x="52" y="12" width="16" height="16" fill="#C7000B"/>
<rect x="56" y="16" width="8" height="8" fill="white"/>
<!-- calendar -->
<rect x="84" y="8" width="32" height="24" fill="white" stroke="#000" stroke-width="2"/>
<rect x="84" y="8" width="32" height="8" fill="#C7000B" stroke="#000" stroke-width="1"/>
<rect x="92" y="18" width="4" height="4" fill="#1A1A1E"/>
<rect x="100" y="18" width="4" height="4" fill="#1A1A1E"/>
<rect x="92" y="24" width="4" height="4" fill="#C7000B"/>
<rect x="100" y="24" width="4" height="4" fill="#1A1A1E"/>
</svg>
