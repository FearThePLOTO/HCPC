<svg width="320" height="240" viewBox="0 0 320 240" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
<!-- background transparent -->
<!-- 8-bit trophy base 32x32 grid scaled -->
<!-- Trophy cup -->
<rect x="112" y="40" width="96" height="16" fill="#C7000B"/>
<rect x="104" y="56" width="112" height="16" fill="#C7000B"/>
<rect x="96" y="72" width="128" height="48" fill="#FF1A2B"/>
<rect x="96" y="72" width="128" height="8" fill="#FFFFFF" opacity="0.25"/>
<!-- inner shine -->
<rect x="112" y="80" width="16" height="32" fill="white" opacity="0.35"/>
<rect x="136" y="80" width="8" height="32" fill="white" opacity="0.15"/>
<!-- cup bottom -->
<rect x="104" y="120" width="112" height="8" fill="#9E0009"/>
<rect x="112" y="128" width="96" height="16" fill="#C7000B"/>
<!-- stem -->
<rect x="144" y="144" width="32" height="32" fill="#C7000B"/>
<rect x="152" y="144" width="8" height="32" fill="white" opacity="0.2"/>
<!-- base -->
<rect x="112" y="176" width="96" height="16" fill="#1A1A1E"/>
<rect x="104" y="192" width="112" height="12" fill="#1A1A1E"/>
<rect x="96" y="204" width="128" height="8" fill="#0F1115"/>
<!-- handles pixel -->
<rect x="80" y="80" width="16" height="24" fill="#C7000B"/>
<rect x="80" y="80" width="16" height="8" fill="#9E0009"/>
<rect x="224" y="80" width="16" height="24" fill="#C7000B"/>
<rect x="224" y="80" width="16" height="8" fill="#9E0009"/>
<!-- stars 8-bit -->
<rect x="68" y="48" width="8" height="8" fill="#FFD23F"/>
<rect x="60" y="56" width="24" height="8" fill="#FFD23F"/>
<rect x="68" y="64" width="8" height="8" fill="#FFD23F"/>
<rect x="244" y="48" width="8" height="8" fill="#FFD23F"/>
<rect x="236" y="56" width="24" height="8" fill="#FFD23F"/>
<rect x="244" y="64" width="8" height="8" fill="#FFD23F"/>
<rect x="72" y="148" width="4" height="4" fill="#FFD23F"/>
<rect x="244" y="132" width="4" height="4" fill="#FFD23F"/>
<!-- ground pixel shadow -->
<rect x="120" y="216" width="80" height="4" fill="#000" opacity="0.2"/>
<!-- label -->
<text x="160" y="232" text-anchor="middle" font-family="monospace" font-size="8" fill="#1A1A1E" letter-spacing="1.5" font-weight="700">LVL 01 - HCPC</text>
</svg>
